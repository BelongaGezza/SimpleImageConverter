[workspace]
resolver = "2"
members = [
    "common",
    "img-core",
    "img-convert",
    "mesh-core",
    "mesh-convert",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.92"
authors = ["Simple Image Converter Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/BelongaGezza/SimpleImageConverter"

[workspace.dependencies]
# Error handling
anyhow = "1.0"
thiserror = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# I/O
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging (optional, for future use)
log = "0.4"

# 2D image processing
image = "0.25"
resvg = "0.40"
tiny-skia = "0.11"

# 3D mesh processing
stl_io = "0.7"
nalgebra = "0.33"
tobj = "4.0"
# Note: ply-rs removed due to CVE-2020-25573 - use ply-rs-bw directly in mesh-core
ahash = "0.8"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Testing
tempfile = "3.10"

[profile.release]
opt-level = "z"  # Optimize for size
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

