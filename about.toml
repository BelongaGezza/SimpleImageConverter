# cargo-about configuration for SimpleImageConverter
# Generates THIRD_PARTY_LICENSES.txt for binary distributions

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "NCSA",
]

# Ignore dev-only and build-only dependencies for distribution
ignore-dev-dependencies = true
ignore-build-dependencies = true
