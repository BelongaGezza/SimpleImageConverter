# Reuse existing conversion + queue logic (no UI)
converter-gui = { path = "../converter-gui" }

# Workspace deps (used directly for detection/typing where needed)
common = { path = "../common" }
img-core = { path = "../img-core" }
mesh-core = { path = "../mesh-core" }
thiserror = { workspace = true }

