# Cargo Deny Configuration
# Security-focused dependency checking for SimpleImageConverter

[advisories]
# The database of advisories to check
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Ignore advisories for specific crates
ignore = [
    # paste is unmaintained but is a transitive dependency from image->ravif->rav1e
    # No security vulnerability, just maintenance status
    "RUSTSEC-2024-0436",
    # derivative is unmaintained - transitive via eframe->accesskit_unix->zbus
    # No security vulnerability, just maintenance status
    "RUSTSEC-2024-0388",
    # instant is unmaintained - transitive via eframe->accesskit_unix->futures-lite->fastrand
    # No security vulnerability, just maintenance status
    "RUSTSEC-2024-0384",
    # core2 is unmaintained/yanked - transitive via image->ravif->rav1e->bitstream-io
    # No security vulnerability, just maintenance status; no fixed release available
    "RUSTSEC-2026-0105",
]

[licenses]
# Allow permissive licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "NCSA",  # University of Illinois/NCSA Open Source License (used by libfuzzer-sys)
    "OFL-1.1",  # SIL Open Font License 1.1 (fonts embedded in egui/epaint)
]
# Confidence threshold for license detection
confidence-threshold = 0.8

# Exceptions for crates with non-SPDX license expressions
# epaint (egui's painting library) embeds fonts that use font-specific licenses:
# - OFL-1.1: SIL Open Font License (OSI approved, FSF free)
# - UFL-1.0: Ubuntu Font License (permissive font license)
# These are standard, permissive font licenses safe for distribution
[[licenses.exceptions]]
name = "epaint"
allow = ["LicenseRef-UFL-1.0"]

[bans]
# Check for multiple versions of the same crate
multiple-versions = "warn"
# Wildcards in version requirements
wildcards = "allow"
# Highlight which crates are causing duplicates
highlight = "all"

[sources]
# Only allow crates from crates.io
unknown-registry = "deny"
unknown-git = "warn"
